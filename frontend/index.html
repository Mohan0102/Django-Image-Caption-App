<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Caption Generator</title>
<style>
  :root{--bg:#0f1220;--card:#181c30;--fg:#eef0fa;--mut:#9aa1c4;--acc:#6c8cff;--err:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:16px}
  main{width:100%;max-width:520px;background:var(--card);border-radius:16px;padding:24px;box-shadow:0 10px 40px #0006}
  h1{margin:0 0 4px;font-size:1.4rem} p.sub{margin:0 0 20px;color:var(--mut)}
  #drop{border:2px dashed #3a4170;border-radius:12px;padding:24px;text-align:center;cursor:pointer;color:var(--mut)}
  #drop.over{border-color:var(--acc);color:var(--fg)}
  #preview{display:none;width:100%;max-height:320px;object-fit:contain;border-radius:12px;margin-top:16px}
  button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  #result{margin-top:16px;padding:14px;border-radius:10px;background:#0f1220;display:none;font-size:1.1rem}
  #result.err{color:var(--err)}
</style>
</head>
<body>
<main>
  <h1>Image Caption Generator</h1>
  <p class="sub">Upload a photo and the model describes it.</p>
  <label id="drop" for="file">Click or drop an image here</label>
  <input id="file" type="file" accept="image/*" hidden>
  <img id="preview" alt="Preview">
  <button id="go" disabled>Generate caption</button>
  <div id="result" role="status"></div>
</main>
<script>
const API = "http://127.0.0.1:8000/api/caption/";
const $ = id => document.getElementById(id);
let file = null;

function setFile(f){
  if(!f || !f.type.startsWith("image/")) return;
  file = f;
  $("preview").src = URL.createObjectURL(f);
  $("preview").style.display = "block";
  $("drop").textContent = f.name;
  $("go").disabled = false;
  $("result").style.display = "none";
}
$("file").onchange = e => setFile(e.target.files[0]);
const drop = $("drop");
["dragover","dragenter"].forEach(ev => drop.addEventListener(ev, e => {e.preventDefault(); drop.classList.add("over");}));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => {e.preventDefault(); drop.classList.remove("over");}));
drop.addEventListener("drop", e => setFile(e.dataTransfer.files[0]));

$("go").onclick = async () => {
  const out = $("result");
  $("go").disabled = true; $("go").textContent = "Generating…";
  out.style.display = "block"; out.className = ""; out.textContent = "Working…";
  try {
    const form = new FormData(); form.append("image", file);
    const res = await fetch(API, {method:"POST", body: form});
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || "Request failed");
    out.textContent = data.caption.charAt(0).toUpperCase() + data.caption.slice(1) + ".";
  } catch(e) {
    out.className = "err";
    out.textContent = e.message === "Failed to fetch" ? "Cannot reach the backend. Is the Django server running?" : e.message;
  } finally {
    $("go").disabled = false; $("go").textContent = "Generate caption";
  }
};
</script>
</body>
</html>
